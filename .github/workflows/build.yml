name: Build Windows Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exe
        shell: cmd
        run: g++ -std=c++17 main.cpp -o dup_cleaner_app.exe -lshell32 -static-libgcc -static-libstdc++
      - uses: actions/upload-artifact@v4
        with:
          name: dup-cleaner-windows
          path: dup_cleaner_app.exe
